[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cropai"
version = "0.1.0"
description = "SIH26131 — Early detection and management of crop diseases and pest infestations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CROP-AI / SIH26131" }]
dependencies = [
  "pyyaml>=6.0.1",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
]
train = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "ultralytics>=8.3.0",
  "onnx>=1.16.0",
  "onnxruntime>=1.18.0",
  "lightgbm>=4.3.0",
  "xgboost>=2.0.0",
  "scikit-learn>=1.4.0",
  "numpy>=1.26.0",
]
geo = [
  "h3>=3.7.7",
  "shapely>=2.0.0",
]
api = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
]

[project.scripts]
cropai = "cropai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "slow: optional slower checks",
  "requires_data: needs downloaded public datasets",
]

[tool.ruff]
line-length = 100
target-version = "py310"
