risk_features:
  weather:
    - temperature_c
    - humidity_pct
    - rainfall_mm
    - wind_ms
    - soil_moisture
    - rainfall_1d
    - rainfall_3d
    - rainfall_7d
    - humidity_rolling_3d
    - humidity_rolling_7d
    - temperature_range_1d
    - high_humidity_hours
    - rainfall_frequency_7d
  crop:
    - crop_id
    - variety
    - growth_stage
    - days_since_planting
  history:
    - days_since_previous_outbreak
    - recent_positive_detections
    - recent_pest_count_trend
  trap:
    - trap_count_1d
    - trap_count_3d
    - trap_count_7d
  spatial:
    - h3_index
    - nearby_positive_count
    - hotspot_score
  missing_data_policy: continue_with_available_mark_reduced_confidence

advisory:
  categories:
    - monitoring
    - cultural_control
    - mechanical_control
    - biological_control
    - chemical_control
    - safe_use_guidance
    - follow_up_monitoring
    - expert_referral
  chemical_policy: >
    Never invent dosage, frequency, PHI, or legal approval. If a verified IPM
    package does not contain the required chemical details, escalate to
    extension / laboratory consultation.
  knowledge_dir: knowledge/ipm
  languages: [en, hi, mr]

geospatial:
  h3_resolution_field: 10
  h3_resolution_cluster: 8
  h3_resolution_district: 6
  hotspot_methods: [kde, dbscan, h3_aggregation]
  temporal_decay_halflife_days: 7
