# CROP-AI domain configuration — data-driven crop / disease / pest taxonomy.
# Source of operational truth for classes, severity, confidence, and advisory references.
# Do not hard-code this taxonomy in Python.

schema_version: "1.1.0"
dataset_version_target: "v0.1.1-phase1"
problem:
  id: SIH26131
  title: Early detection and management of crop diseases and pest infestations
  organization: Government of Maharashtra
  category: Software
  theme: Agriculture, FoodTech & Rural Development
  geography_primary: India
  geography_sponsor: Maharashtra, India
  languages_farmer:
    - en
    - hi
    - mr
  statement: >
    Farmers often recognise crop diseases or pest infestations only after visible
    damage has spread. Extension staff may cover large areas, while laboratory
    diagnosis and expert advice may not be immediately available. Weather, crop
    stage, variety, soil condition and local pest history influence risk, but
    these inputs are rarely combined into actionable farm-level alerts.
    Incorrect diagnosis may lead to delayed treatment, excessive or
    inappropriate pesticide use, increased cultivation cost, residue concerns
    and yield loss. The challenge is to provide timely, reliable and locally
    relevant detection, forecasting and management support.
  expected_solution: >
    A farmer- and extension-worker-friendly crop-health system that supports
    image-based symptom identification, pest-trap or sensor inputs,
    weather-based risk forecasting, geospatial hotspot mapping, expert
    validation and multilingual advisories. The system should recommend
    integrated pest and disease management actions, safe input usage, referral
    to extension or laboratories, and follow-up monitoring. It should learn
    from field confirmations and provide dashboards for agriculture officials.
  expected_outcomes:
    - earlier detection
    - reduced crop loss
    - more targeted pesticide use
    - faster extension response
    - improved surveillance coverage
    - better planning of preventive interventions
  notes: >
    Crop list is a UNION, not a narrowing: India's top-10 staples + Maharashtra
    CROPSAP + required horticulture (tomato, potato, maize, grape). Public
    image coverage does not equal operational coverage. See dataset.md.

# Named crop sets. Do not drop a set to "simplify" v1.
crop_sets:
  top10_india:
    # Ranked by national area / production importance (MoA&FW Agricultural
    # Statistics at a Glance + 2024-25 production snapshot). Not a yield claim.
    - rice
    - wheat
    - sugarcane
    - cotton
    - maize
    - soybean
    - chickpea
    - groundnut
    - mustard
    - pearl_millet
  horticulture_required:
    - tomato
    - potato
    - maize
    - grape
  cropsap_maharashtra:
    - rice
    - soybean
    - cotton
    - pigeon_pea
    - maize
    - sorghum
    - sugarcane
    - chickpea
  retained_not_narrowed:
    - onion
    - pepper
    - pigeon_pea
    - sorghum

confidence_thresholds:
  # Calibrated later. These are conservative operational defaults, not accuracy claims.
  diagnosis_high: 0.85
  diagnosis_review: 0.60
  expert_referral_below: 0.60
  pest_high: 0.80
  severity_min_mask_coverage: 0.02
  image_quality_reject: 0.30

severity:
  # Dual representation: continuous affected_area_pct + ordinal bin.
  # Visual % is a proxy, not a laboratory disease index unless labeled as such.
  method: affected_area_percent
  bins:
    - id: healthy
      label: Healthy
      min_pct: 0.0
      max_pct: 1.0
      score: 0
    - id: early
      label: Early
      min_pct: 1.0
      max_pct: 10.0
      score: 1
    - id: moderate
      label: Moderate
      min_pct: 10.0
      max_pct: 25.0
      score: 2
    - id: severe
      label: Severe
      min_pct: 25.0
      max_pct: 50.0
      score: 3
    - id: very_severe
      label: Very severe
      min_pct: 50.0
      max_pct: 100.0
      score: 4
  unknown_policy: require_expert_if_missing

crop_stages:
  - id: seedling
    bbch_approx: "00-19"
  - id: vegetative
    bbch_approx: "20-39"
  - id: reproductive
    bbch_approx: "40-69"
  - id: ripening
    bbch_approx: "70-89"
  - id: harvest
    bbch_approx: "90-99"
  - id: unknown
    bbch_approx: null

symptom_regions:
  - leaf
  - stem
  - fruit
  - panicle
  - boll
  - cob
  - root
  - whole_plant
  - unknown

detection_classes:
  # Detector vocabulary (YOLO-style). Fine disease ID is the classifier's job.
  - plant
  - leaf
  - fruit
  - pest
  - trap
  - lesion

