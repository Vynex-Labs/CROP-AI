# Training defaults. Phase 2+ will consume this. No training is launched in Phase 1.
schema_version: "1.0.0"
seed: 42
device: auto          # auto | cuda | cpu
precision: fp16       # fp32 | fp16 | int8 (int8 only after measured calibration)
amp: true
compile: false

hardware_profile:
  supported_dev_gpu: NVIDIA RTX 4050
  notes: >
    Agent sandbox has no NVIDIA GPU. User training machine is expected to
    expose CUDA via PyTorch. Scripts must warn if CUDA is missing.

dataloader:
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  batch_size: 16
  gradient_accumulation: 1

classifier:
  candidate: efficientnet_v2_s
  alternatives: [convnext_tiny, mobilenet_v3_large, resnet50]
  image_size: 384
  epochs: 30
  lr: 0.0003
  weight_decay: 0.0001
  pretrained: true
  freeze_backbone_epochs: 2

detector:
  candidate: yolo11n
  alternatives: [yolo11s, yolov8n]
  image_size: 640
  epochs: 50
  pretrained: true

segmentation:
  candidate: yolo11n-seg
  alternatives: [yolo11s-seg]
  image_size: 640
  epochs: 50
  pretrained: true
  evaluate_necessity: true

risk:
  candidate: lightgbm
  alternatives: [xgboost, logistic_baseline, heuristic_unvalidated]
  horizons_days: [1, 3, 7]
  runtime_default: heuristic_unvalidated
  note: >-
    Candidate only. Do not select LightGBM until measured on real outbreak
    labels. Sandbox has 0 labels — refuse silent ML skill claims.

export:
  formats: [pytorch, onnx]
  tensorrt: when_supported
  opset: 17

reproducibility:
  record:
    - timestamp
    - git_commit
    - dataset_version
    - dataset_size
    - model
    - pretrained_checkpoint
    - hyperparameters
    - batch_size
    - epochs
    - learning_rate
    - augmentation
    - hardware
    - gpu
    - vram
    - software_versions
    - cuda_version
    - pytorch_version
    - seed
    - metrics
    - checkpoint_path
  never_overwrite_best: true
  runs_dir: runs
