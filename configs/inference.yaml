schema_version: "1.0.0"
offline_first: true
device: auto
precision: fp16
warmup_images: 2

runtimes:
  preferred: [tensorrt, onnxruntime, pytorch]
  fallback_order: [onnxruntime, pytorch]

timeouts_ms:
  image_load: 2000
  preprocess: 500
  detect: 200
  classify: 150
  segment: 200
  risk: 50
  total: 1500

failure_policy:
  invalid_image: reject_with_reason
  low_quality: request_better_image
  model_failure: log_and_fallback
  missing_weather: continue_reduced_confidence
  missing_soil: continue_record_missing
  missing_trap: continue_reduce_confidence
  database: local_buffer_retry
  network: offline_queue_sync

output_fields:
  - timestamp
  - crop
  - plant_or_leaf_id
  - object_ids
  - bounding_boxes
  - object_classes
  - disease_class
  - disease_probabilities
  - segmentation_masks
  - affected_area
  - severity_estimate
  - confidence
  - model_version

risk_output_fields:
  - timestamp
  - crop
  - disease_risk_1d
  - disease_risk_3d
  - disease_risk_7d
  - pest_risk_1d
  - pest_risk_3d
  - pest_risk_7d
  - calibrated
  - reduced_confidence
  - missing_inputs
  - model_version
